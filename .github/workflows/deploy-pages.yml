name: Deploy to GitHub Pages

# Listo para activar en cuanto el repositorio sea público y GitHub Pages esté habilitado
# (Settings -> Pages -> Build and deployment -> Source: GitHub Actions).
# Cuando quieras que se despliegue automáticamente en cada push a main, descomenta el bloque `push`.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production bundle
        env:
          CI: true
          NG_CLI_ANALYTICS: false
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Configure SPA fallback for GitHub Pages
        run: cp dist/tai-study/browser/index.html dist/tai-study/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tai-study/browser

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
